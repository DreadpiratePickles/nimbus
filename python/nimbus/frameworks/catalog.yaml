# Canonical finding catalog. Every adapter maps native check IDs to one of these.
# weaknesses: vocabulary consumed by the attack-path engine (internal/attackpath/rules.yaml)
# compliance keys: cis_aws, cis_azure, cis_gcp, cis_k8s, cis_github, nist_800_53, pci_dss, hipaa, gdpr, iso_27001
# remediation: template basenames under internal/remediation/templates (format inferred from extension)

# ---------------------------------------------------------------- AWS
S3_PUBLIC_BUCKET:
  title: S3 bucket allows public access
  provider: aws
  severity: HIGH
  resource_type: aws_s3_bucket
  weaknesses: [PUBLIC_DATA_STORE]
  aliases:
    prowler: [s3_bucket_public_access, s3_bucket_policy_public_write_access, s3_bucket_public_write_acl, s3_bucket_public_list_acl, s3_account_level_public_access_blocks]
    checkov: [CKV_AWS_53, CKV_AWS_54, CKV_AWS_55, CKV_AWS_56, CKV2_AWS_6, CKV_AWS_20, CKV_AWS_57]
    trivy: [AVD-AWS-0086, AVD-AWS-0087, AVD-AWS-0091, AVD-AWS-0092, AVD-AWS-0093, AVD-AWS-0094]
    scoutsuite: [s3-bucket-AllUsers-read, s3-bucket-AllUsers-write, s3-bucket-AllUsers-read_acp, s3-bucket-AllUsers-write_acp, s3-bucket-AuthenticatedUsers-read, s3-bucket-AuthenticatedUsers-write, s3-bucket-world-policy-star, s3-bucket-world-policy-arn-star]
    steampipe: [s3_bucket_restrict_public_read_access, s3_bucket_restrict_public_write_access, s3_public_access_block_bucket, s3_bucket_policy_restrict_public_access]
  compliance:
    cis_aws: ["2.1.4"]
    nist_800_53: [AC-3, AC-6, SC-7]
    pci_dss: ["1.3.1", "1.3.4"]
    hipaa: ["164.312(a)(1)"]
    gdpr: ["Art.32"]
    iso_27001: [A.8.3, A.13.1.3]
  remediation: [s3_public_bucket.tf, s3_public_bucket.cfn.yaml]

