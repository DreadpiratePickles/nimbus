# Known engine gaps against lab/ground_truth.yaml, re-measured 2026-10-09 after Track B3.
#
# Each id is an assertion the ground-truth test makes:
#   missed:<path>                   expected path not reported at all
#   low_score:<path>                reported, but best score below its min_score band
#   above_band:<path>               reported above its max_score (a non-critical label ranked higher)
#   false_positive_reported:<path>  seeded false positive produced a path
#   pending_feature_reported:<path> path that a missing feature should suppress is still reported
#   unlabelled_high:<entry> -> <target>  unlabelled path scored >= score_threshold
#
# `go test ./tests/groundtruth` passes while exactly these gaps reproduce. It FAILS when a new
# failure appears (regression, or a gap nobody labelled) and when a gap listed here stops
# reproducing: delete the entry in the same change that fixes it. GROUNDTRUTH_STRICT=1 ignores
# this file (Phase 0 exit criterion (e): the list must be empty).
#
# Track B3 closed GEN-TYPED (the generator emits typed relationships), CLI-TRUSTED (the CLI
# passes trusted_cidrs: F01 is suppressed), the >= 7 band for exposed chains to admin / sensitive
# targets (toxic-combination floor, docs/scoring.md "Path score") and P07's band (relabelled
# medium in lab/ground_truth.yaml). P1-PLANDIFF closed low_score:P12 (CI-entry floor: unprotected
# branch + unpinned OIDC subject → admin, toxic_combination ci-entry; docs/plan-diff.md).
#
# Benchmark honesty (2026-10-09): every pending_feature_reported:<id> entry below is also a false
# positive in the harness's "real-world" precision column (docs/benchmark.md "Honest numbers");
# only the "labelled" column counts it as a hit. Measured today: precision 100% labelled vs 87.1%
# (27/31) real-world; precision@7 100% vs 85.0% (17/20) (F03 x2, F04, S01).
