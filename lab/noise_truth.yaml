# Ground truth for the nimbus NOISE estate (lab/local/noise/estate.yaml). Authored with it, independently of the engine.
#
# Semantics
#   expected_paths (per resource): number of attack paths a precise engine should report in which this resource
#     appears as a step. 0 for every decoy and near-miss. Only the members of the three labelled true-positive
#     chains (true_positives below) carry 1.
#   expected_paths_total: the exact number of attack paths a precise engine should report for the whole estate (3).
#     Any reported path whose resource set is not one of the true_positives chains (or a sub-chain of one, sharing its
#     entry and target) is a false positive.
#   findings: the seeded scanner findings (weakness ids; generated finding id = "lab-" + id) on that resource. They are
#     realistic scanner noise: present and individually "true" as scanner output, but not a path.
#   near_miss: the resource name is designed to look alarming (admin/prod/pii/customer/root/secret); attributes are benign.
#   why: the attribute-level reason it is benign (or, for true positives, its role in the chain).

version: 1
estate: lab/local/noise/estate.yaml
findings_json: lab/local/out/noise.findings.json
author: independent noise-estate author (P0-NOISE); file-read log in lab/local/noise/AUTHOR_LOG.md
authored: 2026-10-09
expected_paths_total: 3

summary:
  resources: 300
  seeded_findings: 103
  near_misses: 26
  true_positive_chains: 3
  true_positive_resources: 9
  benign_resources: 291

classes:
  NZ01: {slug: "public_website_bucket", resources: 12, findings: 11, description: "Public buckets that only serve public website assets (no sensitive tag), mostly behind CloudFront"}
  NZ02: {slug: "alb_private_imdsv2", resources: 35, findings: 10, description: "Internet-facing ALBs in front of private instances (no public IP, IMDSv2 required, scoped roles, no exploitable CVE)"}
  NZ03: {slug: "sg_443_alb_only", resources: 16, findings: 3, description: "Security groups open to 0.0.0.0/0 on 443 only, attached only to load balancers fronting ECS services"}
  NZ04: {slug: "scoped_readonly_role", resources: 12, findings: 1, description: "Roles with broad-but-scoped read-only policies, trusted only by SSO or AWS services"}
  NZ05: {slug: "unreachable_admin_role", resources: 5, findings: 4, description: "Admin roles only assumable via SSO SAML with MFA condition; no workload or external trust"}
  NZ06: {slug: "org_cross_account_trust", resources: 12, findings: 4, description: "Cross-account trusts to the org's own accounts (PrincipalOrgID / ExternalId conditions)"}
  NZ07: {slug: "lambda_url_iam_auth", resources: 16, findings: 3, description: "Lambda function URLs with AuthType AWS_IAM (some with org-scoped resource policies scanners call public)"}
  NZ08: {slug: "eks_private_endpoint", resources: 2, findings: 0, description: "EKS clusters with private-only API endpoints"}
  NZ09: {slug: "k8s_namespaced_read_sa", resources: 30, findings: 5, description: "K8s service accounts bound to namespaced read-only roles"}
  NZ10: {slug: "gcp_custom_least_priv_sa", resources: 19, findings: 5, description: "GCP instances running as custom least-privilege service accounts"}
  NZ11: {slug: "azure_private_storage", resources: 26, findings: 2, description: "Azure storage with private endpoints and no public blob; VMs with scoped managed identities"}
  NZ12: {slug: "github_protected_repo", resources: 20, findings: 5, description: "GitHub repos with branch protection; OIDC deploy roles pinned to protected environments"}
  NZ13: {slug: "iam_user_mfa_rotated", resources: 17, findings: 5, description: "IAM users with MFA and rotated keys"}
  NZ14: {slug: "cve_nonkev_private_host", resources: 16, findings: 16, description: "CVEs not in CISA KEV with low EPSS on private, non-internet-reachable hosts"}
  NZ15: {slug: "dev_sandbox_tagged", resources: 19, findings: 17, description: "Dev/sandbox accounts and projects, tagged as such, holding only synthetic data and no trust into prod"}
  NZ16: {slug: "private_data_store", resources: 8, findings: 2, description: "Sensitive data stores that are private and only reachable from unexposed principals"}
  NZ90: {slug: "near_miss", resources: 26, findings: 4, description: "Alarming names (admin/prod/pii/customer/root/secret) but benign attributes"}
  NZT1: {slug: "true_positive", resources: 9, findings: 6, description: "Deliberate, labelled true positives (3 chains)"}

true_positives:
  - id: TP1
    expected_paths: 1
    kind: "internet -> host (SSH, IMDSv1) -> instance role -> confidential data"
    entry: "arn:aws:ec2:us-east-1:310000000001:security-group/sg-0572f176bd9ef97ee"
    target: "arn:aws:s3:::halyard-finance-ledger"
    chain: ["arn:aws:ec2:us-east-1:310000000001:security-group/sg-0572f176bd9ef97ee", "arn:aws:ec2:us-east-1:310000000001:instance/i-02fc787a0e4afdcc7", "arn:aws:iam::310000000001:role/legacy-reports-role", "arn:aws:s3:::halyard-finance-ledger"]
    findings: ["N098", "N099", "N100"]
    rationale: "SSH (password auth) open to 0.0.0.0/0 on a public-IP host with IMDSv1; its role can read the confidential finance ledger."
  - id: TP2
    expected_paths: 1
    kind: "unprotected repo -> OIDC wildcard sub -> prod admin role"
    entry: "github.com/halyard/release-tools"
    target: "arn:aws:iam::310000000001:role/gha-release-tools"
    chain: ["github.com/halyard/release-tools", "arn:aws:iam::310000000001:role/gha-release-tools"]
    findings: ["N101", "N102"]
    rationale: "Any push to any branch (4 outside collaborators, no protection) can mint OIDC tokens accepted by a prod AdministratorAccess role."
  - id: TP3
    expected_paths: 1
    kind: "unauthenticated function URL -> execution role -> PII table"
    entry: "arn:aws:lambda:us-east-1:310000000001:function:partner-webhook-debug"
    target: "arn:aws:dynamodb:us-east-1:310000000001:table/halyard-customer-contacts"
    chain: ["arn:aws:lambda:us-east-1:310000000001:function:partner-webhook-debug", "arn:aws:iam::310000000001:role/partner-webhook-debug-role", "arn:aws:dynamodb:us-east-1:310000000001:table/halyard-customer-contacts"]
    findings: ["N103"]
    rationale: "Unauthenticated function URL whose role can Scan the customer contacts (PII) table."

