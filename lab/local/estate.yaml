# nimbus local ground-truth lab: a deliberately vulnerable multi-cloud estate.
#
# `go run ./lab/local/gen` turns this file into a native findings JSON
# (lab/local/out/estate.findings.json) that `cloud-posture ingest --source native` accepts.
# Every weakness becomes one FAIL finding with the stable id "lab-<weakness id>".
# Every resource that carries no weakness becomes one PASS "inventory" record
# (check_id lab_inventory) so its relationships still reach the graph builder.
#
# Relationships are typed here (runs_as, bound_to, grants_access_to, ...). The generator
# writes each one into `resource.related` in the typed native form
# {"id": <to>, "kind": <kind>, "attr": {"via": <via>}} (attr left out when there is no via),
# so they reach the graph as typed edges (docs/benchmark.md "Native relationship contract").
#
# Resource ids are the contract shared with lab/terraform/ and lab/ground_truth.yaml.
# Change an id here and the ground truth and Terraform must change with it.
version: 1
name: nimbus-lab-local
source: nimbus-lab

accounts:
  - {provider: aws, id: "111111111111", label: lab-prod, note: "main AWS account (production)"}
  - {provider: aws, id: "222222222222", label: lab-workloads, note: "member account under the SCP-quarantined OU"}
  - {provider: aws, id: "999999999999", label: external-vendor, note: "external account trusted by the vendor role; not owned by the lab"}
  - {provider: azure, id: "00000000-0000-4000-8000-000000000001", label: lab-azure}
  - {provider: gcp, id: nimbus-lab-gcp, label: lab-gcp}
  - {provider: kubernetes, id: nimbus-lab-eks, label: lab-eks}
  - {provider: github, id: nimbus-lab, label: lab-github}
  - {provider: aws, id: "888888888888", label: external-auditor, note: "external audit firm trusted by the auditor role (S29); not owned by the lab"}
  - {provider: okta, id: nimbus-lab.okta.com, label: lab-okta, note: "IdP federated into AWS IAM Identity Center (S21)"}

resources:
  # ---------------------------------------------------------------- S01 public PII bucket
  - id: "arn:aws:s3:::nimbus-lab-customer-pii"
    scenario: S01
    provider: aws
    account: "111111111111"
    region: us-east-1
    type: aws_s3_bucket
    name: nimbus-lab-customer-pii
    attributes:
      tags: {data_classification: pii, environment: production, owner: data-platform, cost_ceiling_usd: "5"}
      public_access_block: false
      bucket_policy_principal: "*"

  # ---------------------------------------------------------------- S02 IMDSv1 EC2 behind 0.0.0.0/0 with admin profile
  - id: "arn:aws:ec2:us-east-1:111111111111:instance/i-0a1b2c3d4e5f60001"
    scenario: S02
    provider: aws
    account: "111111111111"
    region: us-east-1
    type: aws_instance
    name: nimbus-lab-web-01
    attributes:
      tags: {environment: production, owner: web-team}
      public_ip: 198.51.100.10
      vpc_id: vpc-0a1b2c3d4e5f60001
      subnet_id: subnet-0a1b2c3d4e5f60001
      security_groups: [sg-0a1b2c3d4e5f60001]
      metadata_http_tokens: optional
      instance_profile: "arn:aws:iam::111111111111:instance-profile/nimbus-lab-web-profile"
    relationships:
      - {kind: attached_to, to: "arn:aws:ec2:us-east-1:111111111111:security-group/sg-0a1b2c3d4e5f60001"}
      - {kind: runs_as, to: "arn:aws:iam::111111111111:role/nimbus-lab-web-instance-role", via: "instance profile nimbus-lab-web-profile"}
  - id: "arn:aws:ec2:us-east-1:111111111111:security-group/sg-0a1b2c3d4e5f60001"
    scenario: S02
    provider: aws
    account: "111111111111"
    region: us-east-1
    type: aws_security_group
    name: nimbus-lab-web-open
    attributes:
      ingress: [{protocol: "-1", from_port: 0, to_port: 65535, cidr: 0.0.0.0/0}]
    relationships:
      - {kind: allows_traffic_to, to: "arn:aws:ec2:us-east-1:111111111111:instance/i-0a1b2c3d4e5f60001"}
  - id: "arn:aws:iam::111111111111:role/nimbus-lab-web-instance-role"
    scenario: S02
    provider: aws
    account: "111111111111"
    type: aws_iam_role
    name: nimbus-lab-web-instance-role
    attributes:
      attached_policies: ["arn:aws:iam::aws:policy/AdministratorAccess"]

  # ---------------------------------------------------------------- S03 public RDS
  - id: "arn:aws:rds:us-east-1:111111111111:db:nimbus-lab-orders"
    scenario: S03
    provider: aws
    account: "111111111111"
    region: us-east-1
    type: aws_db_instance
    name: nimbus-lab-orders
    attributes:
      tags: {environment: production, data_classification: confidential, owner: commerce}
      publicly_accessible: true
      engine: postgres
      vpc_id: vpc-0a1b2c3d4e5f60001
      db_subnet_group: nimbus-lab-public
      subnet_ids: [subnet-0a1b2c3d4e5f60001, subnet-0a1b2c3d4e5f60002]
      security_groups: [sg-0a1b2c3d4e5f60006]
    relationships:
      - {kind: attached_to, to: "arn:aws:ec2:us-east-1:111111111111:security-group/sg-0a1b2c3d4e5f60006"}
  - id: "arn:aws:ec2:us-east-1:111111111111:security-group/sg-0a1b2c3d4e5f60006"
    scenario: S03
    provider: aws
    account: "111111111111"
    region: us-east-1
    type: aws_security_group
    name: nimbus-lab-rds-open
    attributes:
      ingress: [{protocol: tcp, from_port: 5432, to_port: 5432, cidr: 0.0.0.0/0}]
    relationships:
      - {kind: allows_traffic_to, to: "arn:aws:rds:us-east-1:111111111111:db:nimbus-lab-orders"}

  # ---------------------------------------------------------------- S04 cross-account trust
  - id: "arn:aws:iam::111111111111:role/nimbus-lab-vendor-access"
    scenario: S04
    provider: aws
    account: "111111111111"
    type: aws_iam_role
    name: nimbus-lab-vendor-access
    attributes:
      trust_principals: ["arn:aws:iam::999999999999:root"]
      external_id_required: false
      attached_policies: ["arn:aws:iam::aws:policy/AdministratorAccess"]
    relationships:
      - {kind: trusts, to: "arn:aws:iam::999999999999:root"}

  # ---------------------------------------------------------------- S05 IAM user: no MFA, 400-day key, AdministratorAccess
  - id: "arn:aws:iam::111111111111:user/nimbus-lab-ops-jane"
    scenario: S05
    provider: aws
    account: "111111111111"
    type: aws_iam_user
    name: nimbus-lab-ops-jane
    attributes:
      mfa_active: false
      access_key_1_age_days: 400
      attached_policies: ["arn:aws:iam::aws:policy/AdministratorAccess"]

  # ---------------------------------------------------------------- S06 public Lambda function URL
  - id: "arn:aws:lambda:us-east-1:111111111111:function:nimbus-lab-export"
    scenario: S06
    provider: aws
    account: "111111111111"
    region: us-east-1
    type: aws_lambda_function
    name: nimbus-lab-export
    attributes:
      function_url_auth_type: NONE
    relationships:
      - {kind: runs_as, to: "arn:aws:iam::111111111111:role/nimbus-lab-export-lambda-role"}
  - id: "arn:aws:iam::111111111111:role/nimbus-lab-export-lambda-role"
    scenario: S06
    provider: aws
    account: "111111111111"
    type: aws_iam_role
    name: nimbus-lab-export-lambda-role
    attributes:
      inline_policy: "s3:GetObject on arn:aws:s3:::nimbus-lab-customer-pii/*"
    relationships:
      - {kind: grants_access_to, to: "arn:aws:s3:::nimbus-lab-customer-pii"}

  # ---------------------------------------------------------------- S07 EKS public endpoint + cluster-admin service account
  - id: "arn:aws:eks:us-east-1:111111111111:cluster/nimbus-lab-eks"
    scenario: S07
    provider: aws
    account: "111111111111"
    region: us-east-1
    type: aws_eks_cluster
    name: nimbus-lab-eks
    attributes:
      endpoint_public_access: true
      public_access_cidrs: [0.0.0.0/0]
    relationships:
      - {kind: contains, to: "cluster/clusterrolebinding/ci-deployer-admin"}
  - id: "cluster/clusterrolebinding/ci-deployer-admin"
    scenario: S07
    provider: kubernetes
    account: nimbus-lab-eks
    type: k8s_cluster_role_binding
    name: ci-deployer-admin
    attributes:
      role_ref: cluster-admin
      subjects: ["ci/serviceaccount/deployer"]
    relationships:
      - {kind: bound_to, to: "cluster/clusterrole/cluster-admin"}
  - id: "cluster/clusterrole/cluster-admin"
    scenario: S07
    provider: kubernetes
    account: nimbus-lab-eks
    type: k8s_cluster_role
    name: cluster-admin

  # ---------------------------------------------------------------- S08 K8s pod -> SA -> ClusterRoleBinding(cluster-admin)
  - id: "ci/pod/build-runner-0"
    scenario: S08
    provider: kubernetes
    account: nimbus-lab-eks
    type: k8s_pod
    name: build-runner-0
    attributes:
      namespace: ci
      service_account: deployer
      exposed_by: "service/ci/build-runner (type LoadBalancer, 0.0.0.0/0)"
      image: "ghcr.io/nimbus-lab/build-runner:1.4.0"
    relationships:
      - {kind: runs_as, to: "ci/serviceaccount/deployer"}
  - id: "ci/serviceaccount/deployer"
    scenario: S08
    provider: kubernetes
    account: nimbus-lab-eks
    type: k8s_service_account
    name: deployer
    attributes:
      namespace: ci
    relationships:
      - {kind: bound_to, to: "cluster/clusterrolebinding/ci-deployer-admin"}

  # ---------------------------------------------------------------- S09 GCP default compute SA (editor) on a public GCE instance
  - id: "//compute.googleapis.com/projects/nimbus-lab-gcp/zones/us-central1-a/instances/nimbus-lab-gce-web"
    scenario: S09
    provider: gcp
    account: nimbus-lab-gcp
    region: us-central1
    type: gcp_compute_instance
    name: nimbus-lab-gce-web
    attributes:
      external_ip: 203.0.113.200
      service_account: 123456789012-compute@developer.gserviceaccount.com
      scopes: ["https://www.googleapis.com/auth/cloud-platform"]
    relationships:
      - {kind: runs_as, to: "//iam.googleapis.com/projects/nimbus-lab-gcp/serviceAccounts/123456789012-compute@developer.gserviceaccount.com"}
  - id: "//compute.googleapis.com/projects/nimbus-lab-gcp/global/firewalls/nimbus-lab-allow-ssh-any"
    scenario: S09
    provider: gcp
    account: nimbus-lab-gcp
    type: gcp_compute_firewall
    name: nimbus-lab-allow-ssh-any
    attributes:
      source_ranges: [0.0.0.0/0]
      allowed: ["tcp:22"]
    relationships:
      - {kind: allows_traffic_to, to: "//compute.googleapis.com/projects/nimbus-lab-gcp/zones/us-central1-a/instances/nimbus-lab-gce-web"}
  - id: "//iam.googleapis.com/projects/nimbus-lab-gcp/serviceAccounts/123456789012-compute@developer.gserviceaccount.com"
    scenario: S09
    provider: gcp
    account: nimbus-lab-gcp
    type: gcp_service_account
    name: 123456789012-compute@developer.gserviceaccount.com
    attributes:
      project_roles: [roles/editor]

  # ---------------------------------------------------------------- S10 Azure public blob
  - id: "/subscriptions/00000000-0000-4000-8000-000000000001/resourceGroups/nimbus-lab-rg/providers/Microsoft.Storage/storageAccounts/nimbuslabhrexports"
    scenario: S10
    provider: azure
    account: "00000000-0000-4000-8000-000000000001"
    region: eastus
    type: azure_storage_account
    name: nimbuslabhrexports
    attributes:
      tags: {data_classification: confidential, environment: production, owner: people-ops}
      allow_blob_public_access: true
      container: exports (access level blob)

  # ---------------------------------------------------------------- S11 Azure NSG open RDP -> VM -> managed identity (Contributor)
  - id: "/subscriptions/00000000-0000-4000-8000-000000000001/resourceGroups/nimbus-lab-rg/providers/Microsoft.Network/networkSecurityGroups/nimbus-lab-jump-nsg"
    scenario: S11
    provider: azure
    account: "00000000-0000-4000-8000-000000000001"
    region: eastus
    type: azure_network_security_group
    name: nimbus-lab-jump-nsg
    attributes:
      rules: [{name: allow-rdp-any, port: 3389, source: "*", access: Allow, priority: 100}]
    relationships:
      - {kind: allows_traffic_to, to: "/subscriptions/00000000-0000-4000-8000-000000000001/resourceGroups/nimbus-lab-rg/providers/Microsoft.Compute/virtualMachines/nimbus-lab-jump-01"}
  - id: "/subscriptions/00000000-0000-4000-8000-000000000001/resourceGroups/nimbus-lab-rg/providers/Microsoft.Compute/virtualMachines/nimbus-lab-jump-01"
    scenario: S11
    provider: azure
    account: "00000000-0000-4000-8000-000000000001"
    region: eastus
    type: azure_virtual_machine
    name: nimbus-lab-jump-01
    pass_check: vm_ensure_attached_disks_encrypted_with_cmk   # W6: PASS evidence for compliance (r4 #13); the inventory record keeps its id
    pass_title: "VM disks are encrypted with a customer-managed key"
    attributes:
      public_ip: 198.51.100.20
      os: windows
    relationships:
      - {kind: runs_as, to: "/subscriptions/00000000-0000-4000-8000-000000000001/resourceGroups/nimbus-lab-rg/providers/Microsoft.ManagedIdentity/userAssignedIdentities/nimbus-lab-jump-mi"}
  - id: "/subscriptions/00000000-0000-4000-8000-000000000001/resourceGroups/nimbus-lab-rg/providers/Microsoft.ManagedIdentity/userAssignedIdentities/nimbus-lab-jump-mi"
    scenario: S11
    provider: azure
    account: "00000000-0000-4000-8000-000000000001"
    region: eastus
    type: azure_user_assigned_identity
    name: nimbus-lab-jump-mi
    attributes:
      role_assignments: [{role: Contributor, scope: "/subscriptions/00000000-0000-4000-8000-000000000001"}]

  # ---------------------------------------------------------------- S12 GitHub repo without branch protection -> OIDC deploy role
  - id: "github.com/nimbus-lab/infra-live"
    scenario: S12
    provider: github
    account: nimbus-lab
    type: github_repository
    name: nimbus-lab/infra-live
    attributes:
      default_branch: main
      branch_protection: false
    relationships:
      - {kind: can_assume, to: "arn:aws:iam::111111111111:role/nimbus-lab-gha-deploy", via: "GitHub OIDC sub repo:nimbus-lab/infra-live:*"}
  - id: "arn:aws:iam::111111111111:role/nimbus-lab-gha-deploy"
    scenario: S12
    provider: aws
    account: "111111111111"
    type: aws_iam_role
    name: nimbus-lab-gha-deploy
    attributes:
      trust: "token.actions.githubusercontent.com sub=repo:nimbus-lab/infra-live:*"
      attached_policies: ["arn:aws:iam::aws:policy/AdministratorAccess"]

  # ---------------------------------------------------------------- S13 seeded false positive: SSH open only to the trusted corporate CIDR
  - id: "arn:aws:ec2:us-east-1:111111111111:instance/i-0a1b2c3d4e5f60002"
    scenario: S13
    provider: aws
    account: "111111111111"
    region: us-east-1
    type: aws_instance
    name: nimbus-lab-corp-tools-01
    attributes:
      tags: {environment: production, owner: it-ops}
      public_ip: 198.51.100.30
      vpc_id: vpc-0a1b2c3d4e5f60001
      subnet_id: subnet-0a1b2c3d4e5f60001
      security_groups: [sg-0a1b2c3d4e5f60002]
      metadata_http_tokens: optional
    relationships:
      - {kind: attached_to, to: "arn:aws:ec2:us-east-1:111111111111:security-group/sg-0a1b2c3d4e5f60002"}
      - {kind: runs_as, to: "arn:aws:iam::111111111111:role/nimbus-lab-corp-tools-role"}
  - id: "arn:aws:ec2:us-east-1:111111111111:security-group/sg-0a1b2c3d4e5f60002"
    scenario: S13
    provider: aws
    account: "111111111111"
    region: us-east-1
    type: aws_security_group
    name: nimbus-lab-corp-ssh
    attributes:
      ingress: [{protocol: tcp, from_port: 22, to_port: 22, cidr: 203.0.113.0/24, description: "corporate egress range (trusted_cidrs)"}]
  - id: "arn:aws:iam::111111111111:role/nimbus-lab-corp-tools-role"
    scenario: S13
    provider: aws
    account: "111111111111"
    type: aws_iam_role
    name: nimbus-lab-corp-tools-role
    attributes:
      attached_policies: ["arn:aws:iam::aws:policy/PowerUserAccess"]

  # ---------------------------------------------------------------- S14 path behind an SCP deny (member account 222222222222)
  - id: "arn:aws:ec2:us-east-1:222222222222:instance/i-0a1b2c3d4e5f60003"
    scenario: S14
    provider: aws
    account: "222222222222"
    region: us-east-1
    type: aws_instance
    name: nimbus-lab-batch-01
    attributes:
      tags: {environment: production, owner: batch-team}
      public_ip: 198.51.100.40
      vpc_id: vpc-0a1b2c3d4e5f60003
      subnet_id: subnet-0a1b2c3d4e5f60007
      metadata_http_tokens: optional
    relationships:
      - {kind: runs_as, to: "arn:aws:iam::222222222222:role/nimbus-lab-batch-role"}
  - id: "arn:aws:iam::222222222222:role/nimbus-lab-batch-role"
    scenario: S14
    provider: aws
    account: "222222222222"
    type: aws_iam_role
    name: nimbus-lab-batch-role
    attributes:
      attached_policies: ["arn:aws:iam::aws:policy/AdministratorAccess"]
      governing_scps:
        - id: p-lab0quarantine
          name: nimbus-lab-quarantine
          statement: {Effect: Deny, Action: "*", Resource: "*", Condition: {ArnLike: {"aws:PrincipalArn": "arn:aws:iam::222222222222:role/nimbus-lab-batch-role"}}}

  # ================================================================ P1-LAB L1 scenarios (S15–S30; labels in lab/ground_truth.yaml)

  # ---------------------------------------------------------------- S15 (F02) Allow s3:* + explicit Deny s3:GetObject
  - id: "arn:aws:lambda:us-east-1:111111111111:function:nimbus-lab-claims-intake"
    scenario: S15
    provider: aws
    account: "111111111111"
    region: us-east-1
    type: aws_lambda_function
    name: nimbus-lab-claims-intake
    attributes:
      function_url_auth_type: NONE
    relationships:
      - {kind: runs_as, to: "arn:aws:iam::111111111111:role/nimbus-lab-claims-intake-role"}
  - id: "arn:aws:iam::111111111111:role/nimbus-lab-claims-intake-role"
    scenario: S15
    provider: aws
    account: "111111111111"
    type: aws_iam_role
    name: nimbus-lab-claims-intake-role
    attributes:
      inline_policy_document:
        Version: "2012-10-17"
        Statement:
          - {Sid: ClaimsIntake, Effect: Allow, Action: "s3:*", Resource: ["arn:aws:s3:::nimbus-lab-claims-pii", "arn:aws:s3:::nimbus-lab-claims-pii/*"]}
          - {Sid: NoClaimsRead, Effect: Deny, Action: "s3:GetObject", Resource: "arn:aws:s3:::nimbus-lab-claims-pii/*"}
    relationships:
      # What an Allow-only collector draws from `s3:*`; the explicit Deny must remove it (F02).
      - {kind: grants_access_to, to: "arn:aws:s3:::nimbus-lab-claims-pii", via: "inline policy ClaimsIntake s3:* (explicit Deny s3:GetObject in NoClaimsRead)"}
  - id: "arn:aws:s3:::nimbus-lab-claims-pii"
    scenario: S15
    provider: aws
    account: "111111111111"
    region: us-east-1
    type: aws_s3_bucket
    name: nimbus-lab-claims-pii
    pass_check: s3_bucket_default_encryption   # W6: PASS evidence for compliance (r4 #13); the inventory record keeps its id
    pass_title: "S3 bucket encrypts objects by default (SSE-KMS)"
    attributes:
      tags: {data_classification: pii, environment: production, owner: claims}
      public_access_block: true

  # ---------------------------------------------------------------- S16 (F03) SG 0.0.0.0/0:22, NACL denies 22
  - id: "arn:aws:ec2:us-east-1:111111111111:instance/i-0a1b2c3d4e5f60004"
    scenario: S16
    provider: aws
    account: "111111111111"
    region: us-east-1
    type: aws_instance
    name: nimbus-lab-sftp-01
    attributes:
      tags: {environment: production, owner: partner-ops}
      public_ip: 198.51.100.50
      vpc_id: vpc-0a1b2c3d4e5f60001
      subnet_id: subnet-0a1b2c3d4e5f60004
      security_groups: [sg-0a1b2c3d4e5f60004]
      network_acl: acl-0a1b2c3d4e5f60001
      metadata_http_tokens: required
    relationships:
      - {kind: attached_to, to: "arn:aws:ec2:us-east-1:111111111111:security-group/sg-0a1b2c3d4e5f60004"}
      - {kind: runs_as, to: "arn:aws:iam::111111111111:role/nimbus-lab-sftp-role", via: "instance profile nimbus-lab-sftp-profile"}
  - id: "arn:aws:ec2:us-east-1:111111111111:security-group/sg-0a1b2c3d4e5f60004"
    scenario: S16
    provider: aws
    account: "111111111111"
    region: us-east-1
    type: aws_security_group
    name: nimbus-lab-sftp-ssh
    attributes:
      ingress: [{protocol: tcp, from_port: 22, to_port: 22, cidr: 0.0.0.0/0}]
    relationships:
      - {kind: allows_traffic_to, to: "arn:aws:ec2:us-east-1:111111111111:instance/i-0a1b2c3d4e5f60004"}
  - id: "arn:aws:ec2:us-east-1:111111111111:network-acl/acl-0a1b2c3d4e5f60001"
    scenario: S16
    provider: aws
    account: "111111111111"
    region: us-east-1
    type: aws_network_acl
    name: nimbus-lab-sftp-nacl
    attributes:
      network_acl_id: acl-0a1b2c3d4e5f60001
      vpc_id: vpc-0a1b2c3d4e5f60001
      default: false
      subnet_ids: [subnet-0a1b2c3d4e5f60004]
      ingress:
        - {rule_number: 90, protocol: tcp, from_port: 22, to_port: 22, cidr: 0.0.0.0/0, action: deny}
        - {rule_number: 100, protocol: "-1", from_port: 0, to_port: 0, cidr: 0.0.0.0/0, action: allow}
        - {rule_number: 32767, protocol: "-1", cidr: 0.0.0.0/0, action: deny}
      egress:
        - {rule_number: 100, protocol: "-1", from_port: 0, to_port: 0, cidr: 0.0.0.0/0, action: allow}
        - {rule_number: 32767, protocol: "-1", cidr: 0.0.0.0/0, action: deny}
  - id: "arn:aws:iam::111111111111:role/nimbus-lab-sftp-role"
    scenario: S16
    provider: aws
    account: "111111111111"
    type: aws_iam_role
    name: nimbus-lab-sftp-role
    attributes:
      attached_policies: ["arn:aws:iam::aws:policy/AdministratorAccess"]

  # ---------------------------------------------------------------- S17 (F04) PubliclyAccessible RDS in an isolated subnet
  - id: "arn:aws:rds:us-east-1:111111111111:db:nimbus-lab-ledger"
    scenario: S17
    provider: aws
    account: "111111111111"
    region: us-east-1
    type: aws_db_instance
    name: nimbus-lab-ledger
    attributes:
      tags: {environment: production, data_classification: confidential, owner: finance}
      publicly_accessible: true
      engine: postgres
