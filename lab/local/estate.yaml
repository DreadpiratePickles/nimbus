  # route_table {id, routes} / internet_gateway_route / network_acl_id; aws_network_acl with
  # subnet_ids / ingress / egress), so graph reachability (internal/reach) decides reachable or
  # blocked instead of "unknown". The facts follow the labels: hosts and the orders DB on labelled
  # internet paths sit in public subnets (route 0.0.0.0/0 -> igw, default allow-all NACL); the
  # SFTP host keeps its NACL deny on 22 (F03); the ledger's subnet group is isolated (F04). Appended
