# S07/S08 Kubernetes objects. Apply only to the throwaway lab cluster:
#   aws eks update-kubeconfig --name nimbus-lab-eks && kubectl apply -f lab/terraform/aws/k8s/ci-deployer.yaml
apiVersion: v1
kind: Namespace
metadata: {name: ci, labels: {nimbus_lab: "true"}}
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: deployer, namespace: ci, labels: {nimbus_lab_id: ci-serviceaccount-deployer}}
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: {name: ci-deployer-admin, labels: {nimbus_lab: "true"}}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: cluster-admin}
subjects: [{kind: ServiceAccount, name: deployer, namespace: ci}]
---
apiVersion: v1
kind: Pod
metadata: {name: build-runner-0, namespace: ci, labels: {app: build-runner}}
spec:
  serviceAccountName: deployer
  containers:
    - name: runner
      image: public.ecr.aws/nginx/nginx:1.25.0 # stand-in for the vulnerable build-runner image
      ports: [{containerPort: 80}]
---
apiVersion: v1
kind: Service
metadata: {name: build-runner, namespace: ci}
spec:
  type: LoadBalancer
  selector: {app: build-runner}
  ports: [{port: 80, targetPort: 80}]
