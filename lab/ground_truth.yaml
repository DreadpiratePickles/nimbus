# Ground truth for the local lab estate (lab/local/estate.yaml).
#
# Labelled by hand from the seeded weaknesses. The engine's output must never be
# copied in here: this file says what a correct attack-path engine reports.
#
# Path matching (tests/groundtruth):
#   entry   "internet" or the resource id of the first foothold (a phished identity,
#           an unprotected repo, a role an external account can assume).
#   target  the crown jewel the path ends on (only optional_hops may follow it, e.g. the
#           ClusterRole an engine renders after a binding; Track B2 item 7).
#   hops    resource ids on the path in order, excluding the abstract internet node.
#           A reported path matches when entry and target are equal, every hop is present,
#           and every reported resource is a hop or an optional_hop (hop order is ignored).
#   optional_hops  network controls / plumbing a correct engine may or may not render as a
#           node (security groups, firewalls, the ClusterRole behind a binding).
#   weaknesses  seeded weakness ids (finding id lab-<id>) the path depends on.
#   min_score   expected score band: the best matching reported path must score >= this.
#   max_score   optional upper bound (exclusive) of the band: the best match must score < this.
#   band        band name when the label is below score_threshold (medium: 5 <= score < 7);
#               needs band_reason (why the path is not critical) and max_score <= threshold.
#   status  expected         must be reported with score >= min_score
#           false_positive   must NOT be reported (no reported path may match it, and no
#                            path may pass through any of its hops from the internet)
#           pending-feature  correct today only because the engine lacks a feature; should
#                            NOT be reported once that feature lands (it is reported today
#                            and tracked in lab/known_gaps.yaml)
#   claim   the competitor claim this path demonstrates.
