# cloud-posture.yaml — copy to the repo root or ~/.cloud-posture/cloud-posture.yaml
accounts:
  aws-prod:
    provider: aws
    profile: prod              # or role_arn: arn:aws:iam::123456789012:role/CloudPostureScanRole
    regions: [us-east-1, eu-west-1]
    tools: [native, python-checks, prowler, steampipe]
    criticality: production
  azure-dev:
    provider: azure
    subscription_id: 00000000-0000-0000-0000-000000000000
    tools: [native, prowler]
    criticality: dev
  gcp-staging:
    provider: gcp
    project_id: my-project
    tools: [native, prowler, steampipe]
  k8s-prod:
    provider: kubernetes
    kube_context: prod-eks
    tools: [native, trivy, checkov]
  github-org:
    provider: github
    org: my-org
    token_env: GITHUB_TOKEN
  okta:
    provider: okta
    domain: https://acme.okta.com
    token_env: OKTA_API_TOKEN
  m365:
    provider: m365
    tenant_id: 11111111-2222-3333-4444-555555555555

scan:
  iac_paths: [./infra]
  parallel: 4
  # attack_rules_file: ./custom-attack-rules.yaml
  # crown_jewels:
  #   - {pattern: "*payments*", criticality: 4}

integrations:
  slack:        {url_env: SLACK_WEBHOOK_URL, min_severity: HIGH}
  teams:        {url_env: TEAMS_WEBHOOK_URL, min_severity: CRITICAL}
  pagerduty:    {token_env: PAGERDUTY_ROUTING_KEY, min_severity: CRITICAL}
  github_issues: {repo: my-org/security-backlog, token_env: GITHUB_TOKEN, min_severity: HIGH, labels: [cloud]}
  jira:         {url: https://acme.atlassian.net, email_env: JIRA_EMAIL, token_env: JIRA_API_TOKEN, project: SEC, issue_type: Bug, min_severity: HIGH}
  datadog:      {token_env: DD_API_KEY, site: datadoghq.com}
  siem:         {type: splunk_hec, url_env: SPLUNK_HEC_URL, token_env: SPLUNK_HEC_TOKEN, index: security}
  sentinel:     {workspace_id: <workspace-id>, key_env: SENTINEL_SHARED_KEY}

plugins:
  - name: okta-custom
    command: [python3, -m, nimbus.plugin, ./plugins/okta_custom.py]

python:
  enabled: true
  executable: python3

neo4j:
  uri_env: NEO4J_URI          # bolt://localhost:7687
  user_env: NEO4J_USER
  password_env: NEO4J_PASSWORD
