# cloud-posture.yaml — copy to the repo root or ~/.cloud-posture/cloud-posture.yaml
# Secrets are never written here: literal token:/password:/secret: values fail
# validation — use the matching *_env key naming an environment variable.
accounts:
  aws-prod:
    provider: aws
    profile: prod              # or role_arn: arn:aws:iam::123456789012:role/CloudPostureScanRole
    regions: [us-east-1, eu-west-1]
    tools: [native, python-checks, prowler, steampipe]
    criticality: production
  azure-dev:
    provider: azure
    subscription_id: 00000000-0000-0000-0000-000000000000
    tools: [native, prowler]
    criticality: dev
  gcp-staging:
    provider: gcp
    project_id: my-project
    tools: [native, prowler, steampipe]
  k8s-prod:
    provider: kubernetes
    kube_context: prod-eks
    tools: [native, trivy, checkov]
  github-org:
    provider: github
    org: my-org
    token_env: GITHUB_TOKEN
  okta:
    provider: okta
    domain: https://acme.okta.com
    token_env: OKTA_API_TOKEN
  m365:
    provider: m365
    tenant_id: 11111111-2222-3333-4444-555555555555

scan:
  iac_paths: [./infra]
  parallel: 4
  account_timeout: 10m        # per-account native collection limit (Go duration; "none" disables)
  # attack_rules_file: ./custom-attack-rules.yaml

# Corporate egress / VPN ranges. Internet exposure whose every source CIDR is inside
# these is labelled exposure: trusted (wide = 0.0.0.0/0 or ::/0, narrow = any other
# public CIDR) and trusted-only attack paths are suppressed with a reason.
# 0.0.0.0/0 and ::/0 are rejected.
trusted_cidrs:
  - 203.0.113.0/24            # office egress
  - 198.51.100.10             # VPN concentrator (bare IP = /32)

# Business-priority (crown-jewel) rules. Every selector set on a rule must match;
# list selectors match any entry; types accept globs; a tag value of "*" means
# "tag present". The highest matching level wins: very_high > high > medium > low.
# At most 200 rules are used (extra rules are dropped with a warning).
crown_jewels:
  - {level: very_high, types: [aws_s3_bucket, gcp_storage_bucket, azure_storage_account], tags: {classification: pii}}
  - {level: high, name_regex: "^payments-", accounts: [aws-prod]}
  - {level: medium, types: ["aws_db_*", azure_sql_server]}

integrations:
  slack:        {url_env: SLACK_WEBHOOK_URL, min_severity: HIGH}
  teams:        {url_env: TEAMS_WEBHOOK_URL, min_severity: CRITICAL}
  pagerduty:    {token_env: PAGERDUTY_ROUTING_KEY, min_severity: CRITICAL}
  github_issues: {repo: my-org/security-backlog, token_env: GITHUB_TOKEN, min_severity: HIGH, labels: [cloud]}
  jira:         {url: https://acme.atlassian.net, email_env: JIRA_EMAIL, token_env: JIRA_API_TOKEN, project: SEC, issue_type: Bug, min_severity: HIGH}
  datadog:      {token_env: DD_API_KEY, site: datadoghq.com}
  siem:         {type: splunk_hec, url_env: SPLUNK_HEC_URL, token_env: SPLUNK_HEC_TOKEN, index: security}
  sentinel:     {workspace_id: <workspace-id>, key_env: SENTINEL_SHARED_KEY}

plugins:
  - name: okta-custom
    command: [python3, -m, nimbus.plugin, ./plugins/okta_custom.py]

python:
  enabled: true
  executable: python3

neo4j:
  uri_env: NEO4J_URI          # bolt://localhost:7687
  user_env: NEO4J_USER
  password_env: NEO4J_PASSWORD

# Governance (docs/governance.md): who owns each Issue and when it is due.
# Rules are evaluated in order; the first match wins. owner is an address/team,
# "tag:<Key>" (the resource's tag value) or "codeowners" (CODEOWNERS owner of the
# IaC file). Unresolved owners fall back to defaults.owner_tags -> CODEOWNERS ->
# accounts.<name>.owner -> defaults.owner. SLA days default to 7/14/30/90.
governance:
  rules:
    - id: payments-prod
      match: {provider: aws, account: "aws-prod*", tag: {team: payments}}
      owner: payments-oncall@example.com
      sla_days: {critical: 3, high: 7}
      grace_days: 2
    - id: terraform
      match: {iac_path_glob: "infra/**/*.tf"}
      owner: codeowners
    - id: tagged
      match: {tag: {Owner: "*"}}
      owner: "tag:Owner"
  defaults:
    owner: secops@example.com
    sla_days: {critical: 7, high: 14, medium: 30, low: 90}
    grace_days: 3
  digest: {schedule: weekly, sink: slack, group_by: owner}
