name: Feature request
description: Propose a capability
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes: {label: Problem, description: "What are you trying to do and what gets in the way?"}
    validations: {required: true}
  - type: textarea
    id: proposal
    attributes: {label: Proposal, description: "What should nimbus do? How would we verify it works?"}
  - type: textarea
    id: prior-art
    attributes: {label: Prior art, description: "How do other tools (Prowler, Checkov, Cartography, ...) handle this?"}
