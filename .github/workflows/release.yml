# Signed, attested release on a `v*` tag. See SECURITY.md "How releases are built and signed".
#
# Repository settings this workflow assumes (configure once, by a maintainer):
#   * Settings -> General -> Releases -> "Enable release immutability" (immutable releases): once a
#     release is published its assets and tag cannot change. goreleaser therefore uploads into a
#     DRAFT (release.draft in .goreleaser.yaml) and the last step below publishes it only after
#     signing, SBOMs, provenance and self-verification all succeeded.
#   * Tag protection / ruleset on `v*` so only maintainers can push release tags.
#   * Secret HOMEBREW_TAP_GITHUB_TOKEN: fine-grained PAT, contents:write on
#     DreadpiratePickles/homebrew-tap only.
name: release

on:
  push:
    tags: ["v*"]

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CLOUD_POSTURE_NO_NETWORK: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: go vet ./... && go test ./...
      # Release gate (delta r3 #12, release-readiness row #9): the benchmark the README quotes
      # must reproduce with known gaps not tolerated, the README benchmark block must match it,
      # and every numeric README claim must resolve to a test. All before goreleaser runs.
      - name: Ground truth (strict)
        run: GROUNDTRUTH_STRICT=1 make groundtruth
      - name: README benchmark block is current
        run: go run ./tools/readme-bench -check -json lab/local/out/benchmark.json -readme README.md
      - name: README quickstart transcript matches the binary
        # Rebuilds cloud-posture, replays the lab quickstart offline and diffs the README block (r4 #3).
        run: go run ./tools/readme-bench -transcript -check
      - name: README claims resolve
        run: make readme-check
      - name: CHANGELOG has a section for this tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          grep -qF "## [${version}]" CHANGELOG.md || { echo "::error::CHANGELOG.md has no '## [${version}]' section"; exit 1; }

  release:
    needs: test
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write      # create the (draft) release and upload assets
      id-token: write      # cosign keyless signing + attestations (GitHub OIDC)
      packages: write      # push ghcr.io/dreadpiratepickles/cloud-posture
      attestations: write  # actions/attest-build-provenance
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0          # goreleaser changelog needs history and tags
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false            # no cache poisoning surface in the release job
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: goreleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
      - id: meta
        name: Resolve version and image digest
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          digest="$(docker buildx imagetools inspect "ghcr.io/dreadpiratepickles/cloud-posture:${version}" --format '{{json .Manifest}}' | jq -r .digest)"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "bad digest: $digest"; exit 1; }
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
      - name: SLSA provenance for archives
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: ./dist/checksums.txt
      - name: SLSA provenance for the container image
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/dreadpiratepickles/cloud-posture
          subject-digest: ${{ steps.meta.outputs.digest }}
          push-to-registry: true
      - name: Self-verify signatures, checksums and provenance before publishing
        env:
          TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
          DIGEST: ${{ steps.meta.outputs.digest }}
        run: |
          set -euo pipefail
          id="https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@refs/tags/${TAG}"
          iss="https://token.actions.githubusercontent.com"
          cd dist
          cosign verify-blob --bundle checksums.txt.sigstore.json \
            --certificate-identity "$id" --certificate-oidc-issuer "$iss" checksums.txt
          sha256sum -c checksums.txt
          awk '{print $2}' checksums.txt | grep -E '\.(tar\.gz|zip)$' | while read -r a; do
            cosign verify-blob --bundle "$a.sigstore.json" \
              --certificate-identity "$id" --certificate-oidc-issuer "$iss" "$a"
            gh attestation verify "$a" --repo "$GITHUB_REPOSITORY"
          done
          cosign verify "ghcr.io/dreadpiratepickles/cloud-posture@${DIGEST}" \
            --certificate-identity "$id" --certificate-oidc-issuer "$iss" > /dev/null
      - name: Publish the draft release (immutable from here on)
        env:
          TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false
