name: cloud-posture
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '0 6 * * *'
permissions:
  contents: read
  pull-requests: write
  security-events: write
jobs:
  iac:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: {go-version: '1.26'}
      - run: go build -o /usr/local/bin/cloud-posture ./cmd/cloud-posture
      - name: Scan IaC
        run: cloud-posture scan --iac . --output json --out-file cloud-posture.json --sarif cloud-posture.sarif --fail-on HIGH || echo "CP_FAILED=1" >> "$GITHUB_ENV"
      - uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        if: hashFiles('cloud-posture.sarif') != ''
        with: {sarif_file: cloud-posture.sarif}
      - name: PR comment
        if: github.event_name == 'pull_request'
        env: {GITHUB_TOKEN: "${{ github.token }}"}
        run: cloud-posture pr-comment --results cloud-posture.json --repo "${{ github.repository }}" --pr "${{ github.event.pull_request.number }}"
      - run: if [ "${CP_FAILED:-0}" = "1" ]; then exit 1; fi
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: {go-version: '1.26'}
      - name: gofmt (no unformatted files)
        run: |
          out="$(gofmt -l internal cmd tools)"
          if [ -n "$out" ]; then echo "gofmt -l lists:"; echo "$out"; exit 1; fi
      - run: go vet ./... && go test ./...
      - name: Race detector (store, query, server, mcp, cli; twice to shake out order dependence)
        run: go test -race -count=2 -timeout 40m ./internal/store/... ./internal/query/... ./internal/server/... ./internal/mcp/... ./internal/cli/...
      - name: Ground-truth lab (attack-path precision/recall)
        run: go test ./tests/groundtruth -count=1 -v
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: {python-version: '3.12'}
      - run: pip install -e "python[dev,server,pdf]" && cd python && pytest -q
  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: {go-version: '1.26'}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: {node-version: '22', cache: npm, cache-dependency-path: tools/ui-smoke/package-lock.json}
      - run: cd tools/ui-smoke && npm ci && npx playwright install --with-deps chromium
      - name: Dashboard smoke test (cwm UI)
        run: make ui-test
