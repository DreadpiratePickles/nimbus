# Ported from Prowler (Apache-2.0); see credit. Technique facts only; description is nimbus's own.
id: aws-iam-privesc-put-user-policy
title: Inline Policy Injection on User for Self-Escalation (IAM-007)
description: >-
  The principal may write an inline policy onto a user, including itself, granting any permission.
severity: HIGH
confidence: inferred
credit:
  source: Prowler
  licence: Apache-2.0
  url: https://github.com/prowler-cloud/prowler/blob/dd61c417b712856d87b84f5440b2480071991b52/api/src/backend/api/attack_paths/queries/aws.py
  upstream_id: aws-iam-privesc-put-user-policy
  upstream: pathfinding.cloud - IAM-007 - iam:PutUserPolicy
  upstream_url: https://pathfinding.cloud/paths/iam-007
  modified: openCypher query re-expressed as a nimbus path rule evaluated by the IAM evaluator; anchor is an IAM user acting on itself; nimbus does not anchor on principals already allowed * on * (an escalation adds nothing; Prowler lists them)
anchor:
  types: [aws_iam_user]
  include_admin: true
match:
  join: self
  requires_permissions:
    - {action: "iam:PutUserPolicy", resource: anchor}
  target:
    types: [aws_iam_user]
tests:
  fixture:
    nodes:
      - id: arn:aws:iam::123456789012:user/priv
        type: aws_iam_user
        account: "123456789012"
        attributes:
          inline_policy_document:
            Version: "2012-10-17"
            Statement:
              - {Effect: Allow, Action: "iam:PutUserPolicy", Resource: "*"}
      - id: arn:aws:iam::123456789012:role/other
        type: aws_iam_role
        account: "123456789012"
        attributes:
          inline_policy_document:
            Version: "2012-10-17"
            Statement:
              - {Effect: Allow, Action: "iam:PutUserPolicy", Resource: "*"}
      - id: arn:aws:iam::123456789012:user/plain
        type: aws_iam_user
        account: "123456789012"
        attributes:
          inline_policy_document:
            Version: "2012-10-17"
            Statement:
              - {Effect: Allow, Action: "s3:GetObject", Resource: "*"}
  expect:
    - {anchor: "arn:aws:iam::123456789012:user/priv", target: "arn:aws:iam::123456789012:user/priv", match: true}
    - {anchor: "arn:aws:iam::123456789012:role/other", target: "arn:aws:iam::123456789012:role/other", match: false}
    - {anchor: "arn:aws:iam::123456789012:user/plain", target: "arn:aws:iam::123456789012:user/plain", match: false}
