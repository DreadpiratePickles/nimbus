# Ported from Prowler (Apache-2.0); see credit. Technique facts only; description is nimbus's own.
id: aws-iam-privesc-put-role-policy-assume-role
title: Inline Policy Injection with Role Assumption for Lateral Movement (IAM-017)
description: >-
  The principal may write an inline policy granting any permission onto a role it can already assume, then assume it with the injected permissions. Remove iam:PutRolePolicy on roles the principal can assume.
severity: HIGH
confidence: inferred
credit:
  source: Prowler
  licence: Apache-2.0
  url: https://github.com/prowler-cloud/prowler/blob/dd61c417b712856d87b84f5440b2480071991b52/api/src/backend/api/attack_paths/queries/aws.py
  upstream_id: aws-iam-privesc-put-role-policy-assume-role
  upstream: pathfinding.cloud - IAM-017 - iam:PutRolePolicy + sts:AssumeRole
  upstream_url: https://pathfinding.cloud/paths/iam-017
  modified: openCypher query re-expressed as a nimbus path rule evaluated by the IAM evaluator; the role is reached over a graph can_assume edge from the principal (Cartography's STS_ASSUMEROLE_ALLOW), which the evaluator keeps only when the trust policy and the caller's policies allow sts:AssumeRole (an edge it denies is removed), so sts:AssumeRole is not re-checked here; the modifying action must be allowed on that role (Deny and SCPs honoured); nimbus does not anchor on principals already allowed * on * (an escalation adds nothing; Prowler lists them)
anchor:
  types: [aws_iam_user, aws_iam_role]
  include_admin: true
match:
  join: path
  path:
    - {edge: can_assume, to_types: [aws_iam_role]}
  requires_permissions:
    - {action: "iam:PutRolePolicy", resource: target}
  target:
    types: [aws_iam_role]
    exclude_self: true
tests:
  fixture:
    nodes:
      - id: arn:aws:iam::123456789012:user/dev
        type: aws_iam_user
        account: "123456789012"
        attributes:
          inline_policy_document:
            Version: "2012-10-17"
            Statement:
              - {Effect: Allow, Action: ["iam:PutRolePolicy", "sts:AssumeRole"], Resource: "arn:aws:iam::123456789012:role/*"}
      - id: arn:aws:iam::123456789012:user/plain
        type: aws_iam_user
        account: "123456789012"
        attributes:
          inline_policy_document:
            Version: "2012-10-17"
            Statement:
              - {Effect: Allow, Action: "sts:AssumeRole", Resource: "*"}
      - id: arn:aws:iam::123456789012:role/target
        type: aws_iam_role
        account: "123456789012"
        attributes:
          trust_principals: [arn:aws:iam::123456789012:user/dev, arn:aws:iam::123456789012:user/plain]
      - id: arn:aws:iam::123456789012:role/unassumable
        type: aws_iam_role
        account: "123456789012"
        attributes:
          trust_principals: [ec2.amazonaws.com]
    edges:
      - {from: arn:aws:iam::123456789012:user/dev, to: arn:aws:iam::123456789012:role/target, kind: can_assume}
      - {from: arn:aws:iam::123456789012:user/plain, to: arn:aws:iam::123456789012:role/target, kind: can_assume}
  expect:
    - {anchor: "arn:aws:iam::123456789012:user/dev", target: "arn:aws:iam::123456789012:role/target", match: true}
    - {anchor: "arn:aws:iam::123456789012:user/dev", target: "arn:aws:iam::123456789012:role/unassumable", match: false}
    - {anchor: "arn:aws:iam::123456789012:user/plain", target: "arn:aws:iam::123456789012:role/target", match: false}
