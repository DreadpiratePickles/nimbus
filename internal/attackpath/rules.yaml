# Attack-path rules. Each rule is an ordered chain of stages; a stage matches a FAIL
# finding carrying the weakness, joined to the previous step by `relation` (default related):
#   same_resource  - identical resource ID
#   related        - resources linked by an edge (declared relationship, attachment, ID
#                    containment), across accounts and providers
#   same_account   - same provider + account only (co-tenancy, NOT a link)
#   any            - no link at all
# same_account / any are allowed only with `allow_same_account: true` and a `justification`
# (an account- or tenant-wide control such as audit logging). Such chains are `weak_link`
# paths and score x0.5. LoadRules rejects a co-tenancy join without a justification.
# `resource_types` optionally narrows a stage. Score = severity weight × relation tightness.
rules:
  - id: INTERNET_TO_ACCOUNT_ADMIN
    name: Internet-exposed compute to account admin via metadata credentials
    impact: Full cloud account compromise
    mitre: [T1190, T1552.005, T1078.004]
    stages:
      - weakness: PUBLIC_NETWORK_EXPOSURE
        label: Attacker reaches the workload from the internet
      - weakness: IMDSV1_ENABLED
        relation: same_resource
        fallback: related
        label: SSRF or RCE on the workload steals role credentials from IMDSv1
      - weakness: OVERPRIVILEGED_IDENTITY
        relation: related
        label: Stolen credentials carry administrative privileges

  - id: PUBLIC_BUCKET_SILENT_EXFIL
    name: Public storage with no encryption and no access logs
    impact: Undetected bulk data exfiltration
    mitre: [T1530, T1562.008]
    stages:
      - weakness: PUBLIC_DATA_STORE
        label: Bucket readable by anyone on the internet
      - weakness: UNENCRYPTED_AT_REST
        relation: same_resource
        label: Objects stored in clear text
      - weakness: NO_LOGGING
        relation: same_resource
        fallback: same_account
        allow_same_account: true
        justification: "CloudTrail / audit logging is an account-wide control: an account without it records no reads of any bucket in it"
        label: Reads leave no audit trail

  - id: PUBLIC_DATABASE_BREACH
    name: Internet-reachable database holding unencrypted data
    impact: Direct database compromise and data theft
    mitre: [T1190, T1213]
    stages:
      - weakness: PUBLIC_NETWORK_EXPOSURE
        requires: [DATABASE]
        label: Database endpoint reachable from the internet
      - weakness: UNENCRYPTED_AT_REST
        relation: same_resource
        label: Storage and snapshots are unencrypted

  - id: CREDENTIAL_THEFT_TO_ADMIN
    name: Phished identity without MFA holding admin rights, with logging gaps
    impact: Persistent privileged access
    mitre: [T1078, T1556.006, T1562.008]
    stages:
      - weakness: NO_MFA
        label: Password alone unlocks the identity
      - weakness: OVERPRIVILEGED_IDENTITY
        relation: same_resource
        fallback: related
        label: Identity or account carries wildcard privileges
      - weakness: NO_LOGGING
        relation: same_account
        allow_same_account: true
        justification: "audit logging is an account-wide control: the phished identity's actions go unrecorded anywhere in the account"
        label: Activity is not captured by audit logging

  - id: STALE_KEY_ABUSE
    name: Long-lived access key with broad privileges
    impact: Silent persistence via leaked long-lived credentials
    mitre: [T1552.001, T1078.004]
    stages:
      - weakness: STALE_CREDENTIALS
        label: Access key not rotated or unused for 90+ days
      - weakness: OVERPRIVILEGED_IDENTITY
        relation: same_resource
        fallback: related
        label: The key's identity (or a policy attached to it) carries wildcard admin privileges

  - id: CROSS_ACCOUNT_PIVOT
    name: Externally assumable role with admin rights
    impact: Lateral movement from a foreign account
    mitre: [T1078.004, T1098.003]
    stages:
      - weakness: CROSS_ACCOUNT_TRUST
        label: Role trusts external or wildcard principals
      - weakness: OVERPRIVILEGED_IDENTITY
        relation: same_resource
        fallback: related
        label: Trusted role is attached to an admin policy

  - id: CONTAINER_ESCAPE_TO_CLUSTER_ADMIN
    name: Privileged pod escapes to the node and takes the cluster
    impact: Full Kubernetes cluster compromise
    mitre: [T1611, T1552.007, T1078]
    stages:
      - weakness: PRIVILEGED_CONTAINER
        label: Container runs privileged or allows privilege escalation
      - weakness: HOST_ACCESS
        relation: same_resource
        fallback: related
        label: Host namespaces or hostPath expose the node
      - weakness: CLUSTER_ADMIN
        relation: related
        fallback: same_account
        allow_same_account: true
        justification: "a node escape exposes every service-account token mounted on that node; any cluster-admin binding in the same cluster may be among them"
        label: cluster-admin bindings make any stolen token omnipotent

  - id: VULNERABLE_IMAGE_LATERAL_MOVEMENT
    name: Exploitable image in a flat network with mounted service account tokens
    impact: Lateral movement across the cluster
    mitre: [T1190, T1021, T1528]
    stages:
      - weakness: UNPATCHED
        label: Known exploitable vulnerability in a running image
      - weakness: NO_NETWORK_POLICY
        relation: related
        fallback: same_account
        allow_same_account: true
        justification: "a missing NetworkPolicy is a namespace/cluster-wide property: east-west traffic from the exploited pod is unrestricted"
        label: No NetworkPolicy limits east-west traffic
      - weakness: SERVICE_ACCOUNT_TOKEN
        relation: related
        fallback: same_account
        allow_same_account: true
        justification: "with no NetworkPolicy any pod in the cluster is reachable; its mounted token is the next hop"
        label: Pods auto-mount service account tokens for API access

  - id: PUBLIC_K8S_API_TAKEOVER
    name: Public control plane with over-permissive authorization
    impact: Cluster takeover from the internet
    mitre: [T1190, T1078]
    stages:
      - weakness: PUBLIC_NETWORK_EXPOSURE
        requires: [K8S_API]
        label: Kubernetes API reachable from the internet
      - weakness: OVERPRIVILEGED_IDENTITY
        relation: related
        label: Legacy ABAC, disabled RBAC or cluster-admin bindings in that cluster

  - id: SUPPLY_CHAIN_TO_CLOUD
    name: Unprotected repository leaks cloud credentials
    impact: Pipeline-driven cloud compromise
    mitre: [T1195.002, T1552.001, T1078.004]
    stages:
      - weakness: BRANCH_UNPROTECTED
        label: Anyone with push access can land code without review
      - weakness: SECRET_EXPOSURE
        relation: same_resource
        fallback: related
        label: Secrets live in source or are not scanned for
      - weakness: OVERPRIVILEGED_IDENTITY
        relation: related
        label: Leaked credential (or the repo's OIDC trust) maps to an admin identity

  - id: IDENTITY_PROVIDER_TAKEOVER
    name: Weak identity-provider policy guarding privileged accounts
    impact: SSO compromise cascading to every connected app
    mitre: [T1556, T1078.004, T1098]
    stages:
      - weakness: WEAK_AUTH
        label: Sign-on policy allows legacy auth or skips MFA
      - weakness: OVERPRIVILEGED_IDENTITY
        relation: related
        fallback: same_account
        allow_same_account: true
        justification: "an identity provider's sign-on policy applies tenant-wide: every privileged admin in the tenant signs in under it"
        label: Privileged administrators exist under that policy
