# Strategic merge patch for {{ .Kind }}/{{ .Name }}. TODO: size from observed usage (or your
# metrics); a memory limit below peak usage OOM-kills the pod.
# CLI: kubectl top pod --namespace={{ sh .Raw.Namespace }}
spec:
  template:
    spec:
      containers:
        - name: {{ default "app" .Attr.container }}
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
