# Replaces the cluster-admin binding {{ .Name }} with a namespaced Role, in this order:
#   1. kubectl apply this file (adds access; removes nothing).
#   2. TODO: widen the rules below to what the subject really does (audit logs, or
#      the check below with SERVICE_ACCOUNT set) and verify the workload.
# CLI: kubectl auth can-i --list --as=system:serviceaccount:{{ sh .Raw.Namespace }}:"$SERVICE_ACCOUNT"
#   3. Only then remove the old binding:
# CLI: kubectl delete clusterrolebinding -- {{ sh .Raw.Name }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Slug }}-scoped
  namespace: {{ .Namespace }}
rules:
  - apiGroups: ["", "apps"]
    resources: ["pods", "deployments", "services", "configmaps"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Slug }}-scoped
  namespace: {{ .Namespace }}
subjects:
  - kind: {{ default "ServiceAccount" .Attr.subject_kind }}
    name: {{ default "TODO-subject" .Attr.subject }}
    namespace: {{ .Namespace }}
roleRef:
  kind: Role
  name: {{ .Slug }}-scoped
  apiGroup: rbac.authorization.k8s.io
