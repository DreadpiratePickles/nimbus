# Remediation plan metadata for kms_rotation.tf (schema: internal/remediation/metadata.go).
actions_required:
  - "kms:DescribeKey"
  - "kms:EnableKeyRotation"
  - "kms:GetKeyRotationStatus"
validation:
  sql: "SELECT id, resource_id, status FROM findings WHERE canonical_id = {{ sqlstr .F.CanonicalID }} AND resource_id = {{ sqlstr .F.Resource.ID }} AND status = 'FAIL'"
  expect: no_rows
  note: "Confirm with `cloud-posture verify <issue-id>`: it re-reads the resource and closes the Issue only once the finding is gone (`cloud-posture issues` lists the id). Quick check after a re-scan: zero rows from this query."
mitigation: "None needed; rotation is transparent to callers."
effort: S
confidence: high
rollback: "aws kms disable-key-rotation --key-id <key>"
breaks_function:
  value: false
  note: "Rotation keeps old key material for decryption. Asymmetric, HMAC and imported-material keys do not support rotation (the apply fails)."
