# Remediation plan metadata for k8s_service_internal_lb.k8s.yaml (schema: internal/remediation/metadata.go).
actions_required:
  - "services:get"
  - "services:patch"
validation:
  sql: "SELECT id, resource_id, status FROM findings WHERE canonical_id = {{ sqlstr .F.CanonicalID }} AND resource_id = {{ sqlstr .F.Resource.ID }} AND status = 'FAIL'"
  expect: no_rows
  note: "Confirm with `cloud-posture verify <issue-id>`: it re-reads the workload's exposure and closes the Issue only once the finding is gone (`cloud-posture issues` lists the id). Quick check after a re-scan: zero rows from this query."
mitigation: "Add a NetworkPolicy that admits only the expected sources to the pod, or scale the Service's backends to zero, until the load balancer is internal."
effort: S
confidence: medium
rollback: "kubectl patch --namespace={{ shq .Raw.Namespace }} --type=json -p '[{\"op\":\"remove\",\"path\":\"/spec/loadBalancerSourceRanges\"}]' -- service {{ if .Raw.Service }}{{ shq .Raw.Service }}{{ else }}\"$SERVICE\"{{ end }} and remove the internal annotations (the load balancer is recreated as public)."
breaks_function:
  value: true
  note: "Internet clients lose access; the load balancer gets a new, private address."
