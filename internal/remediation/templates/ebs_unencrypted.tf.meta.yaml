# Remediation plan metadata for ebs_unencrypted.tf (schema: internal/remediation/metadata.go).
actions_required:
  - "ec2:EnableEbsEncryptionByDefault"
  - "ec2:GetEbsEncryptionByDefault"
  - "ec2:CreateSnapshot"
  - "ec2:CopySnapshot"
  - "ec2:CreateVolume"
  - "kms:CreateGrant"
  - "kms:DescribeKey"
  - "kms:GenerateDataKeyWithoutPlaintext"
  - "kms:ReEncrypt*"
validation:
  sql: "SELECT id, resource_id, status FROM findings WHERE canonical_id = {{ sqlstr .F.CanonicalID }} AND resource_id = {{ sqlstr .F.Resource.ID }} AND status = 'FAIL'"
  expect: no_rows
  note: "Confirm with `cloud-posture verify <issue-id>`: it re-reads the resource and closes the Issue only once the finding is gone (`cloud-posture issues` lists the id). Quick check after a re-scan: zero rows from this query. The account-level setting does not encrypt the existing volume; expect rows until it is migrated."
mitigation: "Turn on EBS snapshot block public access and restrict ec2:ModifySnapshotAttribute until the volume is migrated."
effort: M
confidence: medium
rollback: "aws ec2 disable-ebs-encryption-by-default (volumes already encrypted stay encrypted)."
breaks_function:
  value: false
  note: "Default encryption affects new volumes only. The flagged volume keeps failing until it is migrated with the snapshot/copy commands in the template (a swap that needs a stop). Encrypted snapshots shared cross-account need KMS grants."
