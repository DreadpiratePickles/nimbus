# Remediation plan metadata for cloudtrail_no_log_validation.tf (schema: internal/remediation/metadata.go).
actions_required:
  - "cloudtrail:DescribeTrails"
  - "cloudtrail:GetTrail"
  - "cloudtrail:UpdateTrail"
validation:
  sql: "SELECT id, resource_id, status FROM findings WHERE canonical_id = {{ sqlstr .F.CanonicalID }} AND resource_id = {{ sqlstr .F.Resource.ID }} AND status = 'FAIL'"
  expect: no_rows
  note: "Confirm with `cloud-posture verify <issue-id>`: it re-reads the resource and closes the Issue only once the finding is gone (`cloud-posture issues` lists the id). Quick check after a re-scan: zero rows from this query."
mitigation: "Turn on S3 Object Lock or versioning on the log bucket so log files cannot be silently replaced."
effort: S
confidence: medium
rollback: "aws cloudtrail update-trail --name <trail> --no-enable-log-file-validation"
breaks_function:
  value: false
  note: "Adds hourly digest files only. s3_bucket_name must be set to the current bucket when nimbus did not collect it (plan fails otherwise)."
