# Remediation plan metadata for az_storage_https.bicep (schema: internal/remediation/metadata.go).
actions_required:
  - "Microsoft.Storage/storageAccounts/read"
  - "Microsoft.Storage/storageAccounts/write"
  - "Microsoft.Resources/deployments/write"
  - "Microsoft.Resources/deployments/whatIf/action"
validation:
  sql: "SELECT id, resource_id, status FROM findings WHERE canonical_id = {{ sqlstr .F.CanonicalID }} AND resource_id = {{ sqlstr .F.Resource.ID }} AND status = 'FAIL'"
  expect: no_rows
  note: "Confirm with `cloud-posture verify <issue-id>`: it re-reads the resource and closes the Issue only once the finding is gone (`cloud-posture issues` lists the id). Quick check after a re-scan: zero rows from this query."
mitigation: "Prefer the in-place CLI: az storage account update --https-only true --min-tls-version TLS1_2."
effort: S
confidence: low
rollback: "Redeploy the previous template or az storage account update with the previous values."
breaks_function:
  value: true
  note: "Full ARM PUT: kind and SKU must be set to the current values (a kind change is irreversible, a SKU change moves data); other unset properties are reset. Plain-HTTP and TLS < 1.2 clients are refused. Not validated with the bicep CLI."
