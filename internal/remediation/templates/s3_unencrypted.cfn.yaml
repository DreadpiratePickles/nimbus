AWSTemplateFormatVersion: '2010-09-09'
Description: Default encryption for bucket {{ .Name }}
Resources:
  {{ .Slug }}:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    Properties:
      BucketName: {{ .Name }}
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256   # SSE-S3; aws:kms with the AWS-managed key would break cross-account readers
