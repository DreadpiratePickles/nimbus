# Remediation plan metadata for gcp_sql_public.tf (schema: internal/remediation/metadata.go).
actions_required:
  - "cloudsql.instances.get"
  - "cloudsql.instances.update"
  - "compute.networks.get"
  - "servicenetworking.services.addPeering"
validation:
  sql: "SELECT id, resource_id, status FROM findings WHERE canonical_id = {{ sqlstr .F.CanonicalID }} AND resource_id = {{ sqlstr .F.Resource.ID }} AND status = 'FAIL'"
  expect: no_rows
  note: "Confirm with `cloud-posture verify <issue-id>`: it re-reads the resource and closes the Issue only once the finding is gone (`cloud-posture issues` lists the id). Quick check after a re-scan: zero rows from this query."
mitigation: "Remove 0.0.0.0/0 from authorized networks and require SSL or the Cloud SQL Auth Proxy."
effort: L
confidence: low
rollback: "gcloud sql instances patch <instance> --assign-ip"
breaks_function:
  value: true
  note: "Clients connecting over the public IP lose access; private IP needs Private Service Access on the VPC and may restart the instance."
