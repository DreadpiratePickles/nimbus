# Remediation plan metadata for az_nsg_open_port.bicep (schema: internal/remediation/metadata.go).
actions_required:
  - "Microsoft.Network/networkSecurityGroups/read"
  - "Microsoft.Network/networkSecurityGroups/securityRules/read"
  - "Microsoft.Network/networkSecurityGroups/securityRules/write"
  - "Microsoft.Resources/deployments/write"
  - "Microsoft.Resources/deployments/whatIf/action"
validation:
  sql: "SELECT id, resource_id, status FROM findings WHERE canonical_id = {{ sqlstr .F.CanonicalID }} AND resource_id = {{ sqlstr .F.Resource.ID }} AND status = 'FAIL'"
  expect: no_rows
  note: "Confirm with `cloud-posture verify <issue-id>`: it re-reads the resource and closes the Issue only once the finding is gone (`cloud-posture issues` lists the id). Quick check after a re-scan: zero rows from this query."
mitigation: "Set the open rule to Deny temporarily (az network nsg rule update --access Deny) or use Defender for Cloud just-in-time VM access."
effort: S
confidence: medium
rollback: "az network nsg rule delete -n nimbus-allow-<port> and -n nimbus-deny-internet-<port>; the original rule is never modified."
breaks_function:
  value: true
  note: "Internet clients outside allowed_source lose access to the port (that is the fix); confirm who uses it first. Fails safe (API error, nothing overwritten) if the chosen priorities are already taken. Not validated with the bicep CLI (not installed)."
