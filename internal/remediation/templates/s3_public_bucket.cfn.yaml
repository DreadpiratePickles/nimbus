AWSTemplateFormatVersion: '2010-09-09'
Description: Block public access on bucket {{ .Name }} (cloud-posture {{ .F.CanonicalID }})
Resources:
  # Existing buckets cannot be adopted by CloudFormation without `import`; run:
  #   aws cloudformation create-change-set --change-set-type IMPORT ...
  # or apply the equivalent CLI command:
  #   aws s3api put-public-access-block --bucket {{ .Name }} --public-access-block-configuration BlockPublicAcls=true,IgnorePublicAcls=true,BlockPublicPolicy=true,RestrictPublicBuckets=true
  {{ .Slug }}:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    Properties:
      BucketName: {{ .Name }}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
