# Remediation plan metadata for az_storage_public_blob.tf (schema: internal/remediation/metadata.go).
actions_required:
  - "Microsoft.Storage/storageAccounts/read"
  - "Microsoft.Storage/storageAccounts/write"
validation:
  sql: "SELECT id, resource_id, status FROM findings WHERE canonical_id = {{ sqlstr .F.CanonicalID }} AND resource_id = {{ sqlstr .F.Resource.ID }} AND status = 'FAIL'"
  expect: no_rows
  note: "Confirm with `cloud-posture verify <issue-id>`: it re-reads the resource and closes the Issue only once the finding is gone (`cloud-posture issues` lists the id). Quick check after a re-scan: zero rows from this query."
mitigation: "Set every container to private: az storage container set-permission --public-access off (per container)."
effort: S
confidence: medium
rollback: "az storage account update -n <name> --allow-blob-public-access true (then re-open individual containers)."
breaks_function:
  value: true
  note: "Anonymous readers (static sites, CDN origins or downloads relying on anonymous blob access) lose access. Network access is not changed."
