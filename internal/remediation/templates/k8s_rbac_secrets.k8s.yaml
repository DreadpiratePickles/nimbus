# Replaces the cluster-wide secrets grant {{ .Name }} with a namespaced Role on named secrets, in this order:
#   1. kubectl apply this file (adds access; removes nothing).
#   2. TODO: list the secrets the subject really reads in resourceNames (audit logs, or the check
#      below) and verify the workload.
# CLI: kubectl auth can-i --list --as=system:serviceaccount:{{ sh .Raw.Namespace }}:"$SERVICE_ACCOUNT"
#   3. Only then remove the old binding:
# CLI: kubectl delete clusterrolebinding -- {{ sh .Raw.Name }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Slug }}-secrets
  namespace: {{ .Namespace }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["TODO-secret-name"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Slug }}-secrets
  namespace: {{ .Namespace }}
subjects:
  - kind: {{ default "ServiceAccount" .Attr.subject_kind }}
    name: {{ default "TODO-subject" .Attr.subject }}
    namespace: {{ .Namespace }}
roleRef:
  kind: Role
  name: {{ .Slug }}-secrets
  apiGroup: rbac.authorization.k8s.io
