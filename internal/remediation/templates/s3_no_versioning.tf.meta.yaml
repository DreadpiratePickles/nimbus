# Remediation plan metadata for s3_no_versioning.tf (schema: internal/remediation/metadata.go).
actions_required:
  - "s3:GetBucketVersioning"
  - "s3:PutBucketVersioning"
validation:
  sql: "SELECT id, resource_id, status FROM findings WHERE canonical_id = {{ sqlstr .F.CanonicalID }} AND resource_id = {{ sqlstr .F.Resource.ID }} AND status = 'FAIL'"
  expect: no_rows
  note: "Confirm with `cloud-posture verify <issue-id>`: it re-reads the resource and closes the Issue only once the finding is gone (`cloud-posture issues` lists the id). Quick check after a re-scan: zero rows from this query."
mitigation: "Back the bucket up with AWS Backup or replication."
effort: S
confidence: high
rollback: "Versioning cannot be turned off, only suspended: set status = \"Suspended\". Existing versions are kept."
breaks_function:
  value: false
  note: "Storage grows with noncurrent versions; add a noncurrent-version expiration lifecycle rule."
