# Golden calibration set for the nimbus risk score (docs/scoring.md).
# TestCalibration scores every scenario in one run (each on its own graph node) and asserts:
#   - band:   the expected band for that scenario
#   - score:  the exact expected score (one decimal) when given — any weight change shows up here
#   - order:  each list is a chain; earlier entries must rank strictly above later ones
# Changing an expectation is a scoring change: bump risk.ScoreVersion and add a changelog entry.
#
# Scenario fields:
#   severity, canonical_id, weaknesses, compliance, cves     -> the finding
#   type, class, exposure, sensitive, labels, criticality,
#   owner, modified_hours_ago, first_seen_hours_ago          -> the graph node / context
#   jewel                                                    -> crown-jewel level from config (very_high|high|medium|low)
#   runs_as_admin                                            -> node runs_as an identity with OVERPRIVILEGED_IDENTITY
#   path_score                                               -> finding sits on an attack path with this score
#   scp_denied                                               -> compensating control hook (Track B: SCP-denied path)
#   no_node                                                  -> no graph node at all (inputs unknown)
#   tags                                                     -> node attr tags (e.g. data_classification)
#   analysis                                                 -> "present" (default): path analysis ran and the
#                                                               scenario paths are its complete paths, so a
#                                                               scenario without path_score is OFF PATH (2.1.0
#                                                               off_path factor); "none": findings-only input,
#                                                               off_path not scored. The 2.0.0 scenarios test
#                                                               one factor each and run with analysis: none.
#
# Scenarios noise_* come from the noise estate classes (lab/noise_truth.yaml, NZxx) and lab_* from
# the labelled lab (lab/ground_truth.yaml, Pxx); both were added in 2.1.0 as the guard for the
# off-path cap and the recalibrated weights (docs/scoring.md changelog).
